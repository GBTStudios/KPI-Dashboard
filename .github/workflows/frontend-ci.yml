name: Frontend CI/CD

on:
  push:
    branches: [staging]
    paths:
      - 'Frontend/**'
  pull_request:
    branches: [staging, main]
    paths:
      - 'Frontend/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Build
        run: npm run build

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
    steps:
      - name: Deployed via Vercel Git integration
        run: echo "Vercel auto-deploys on push to staging — this job just confirms build passed first."